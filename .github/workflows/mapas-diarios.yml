# .github/workflows/mapas-diarios.yml
# ============================================================
# PULSO — regeneracion diaria de los MAPAS
#
# Corre solo, todos los dias, y commitea los PNG actualizados.
#
# ------------------------------------------------------------
# ALCANCE REAL: SOLO LOS MAPAS
#
# Este workflow ejecuta UNICAMENTE scripts/construir_mapas.py. NO
# actualiza las series de datos.
#
# Es importante no confundirlo, porque el nombre "motor de vigilancia"
# sugiere mas de lo que hace. Lo que NO corre solo:
#
#   scripts/construir_serie_diaria.py   -> serie_sst_diaria.csv
#   scripts/construir_series.py         -> serie_sst.csv, serie_vegetacion.csv
#   scripts/construir_reservorios.py    -> serie_reservorios.csv
#
# Esos hay que lanzarlos A MANO. Consecuencia observada: en agosto de 2026
# los mapas estaban al dia mientras serie_sst_diaria.csv llevaba 39 dias
# congelada. El panel de mapas se veia fresco y la alerta servia datos
# viejos.
#
# (Hasta ese momento, ademas, añadirlos aqui no habria servido de nada:
# los tres scripts tenian un fallo por el que daban el año en curso por
# completo y no descargaban nada nuevo. Ese fallo ya esta corregido, asi
# que automatizarlos es ahora viable. Queda pendiente como decision, no
# como imposibilidad tecnica.)
#
# ------------------------------------------------------------
# POR QUE UN CRON EXTERNO Y NO LA PROPIA API
#
# Componer una imagen en Earth Engine tarda entre diez y cuarenta
# segundos: es computo real, tesela por tesela, no latencia de red. Eso
# no puede vivir dentro de una peticion HTTP — el usuario se queda
# mirando una pantalla en blanco y el worker de FastAPI queda bloqueado.
#
# Ademas, los mapas deben regenerarse aunque nadie mire. Si se generaran
# al abrir la pestaña, estarian frescos justo cuando no importa.
#
# ------------------------------------------------------------
# SI EL CRON DEJA DE EJECUTARSE
#
# GitHub DESACTIVA los workflows programados tras 60 dias sin actividad
# en el repositorio. No falla: simplemente deja de correr, en silencio, y
# la pestaña Actions muestra un aviso para reactivarlo.
#
# Es la primera causa a revisar cuando los mapas envejecen sin que nada
# aparezca en rojo. Un `workflow_dispatch` manual lo reactiva.
#
# ------------------------------------------------------------
# LO QUE HAY QUE CONFIGURAR ANTES (una vez)
#
# 1. Google Cloud: crear una cuenta de servicio en el proyecto de GEE y
#    darle DOS roles en IAM (los dos hacen falta, y el error de que falte
#    el segundo no menciona al primero):
#       - Escritor de recursos de Earth Engine (Beta)
#         Generar un thumbnail cuenta como ESCRITURA. Con el rol de
#         Lector, ee.Initialize() funciona y luego falla cada imagen con
#         'earthengine.thumbnails.create denied'.
#       - Consumidor de Service Usage (roles/serviceusage.serviceUsageConsumer)
#         Permite usar APIs facturables dentro del proyecto.
#    Ya no hace falta registrar la cuenta en signup.earthengine.google.com:
#    ese formulario desaparecio y basta con que el proyecto este registrado.
#    Los cambios de IAM tardan varios minutos en propagarse.
#
# 2. GitHub: Settings > Secrets and variables > Actions > New secret
#       Nombre : GEE_SERVICE_ACCOUNT
#       Valor  : el JSON de la cuenta, COMPLETO y en una sola linea.
#
# El JSON NUNCA va al repositorio. Si alguna vez se sube por error, hay
# que revocar la clave en Google Cloud: borrarla del historico de git no
# la invalida.
#
# ------------------------------------------------------------
# OJO CON .gitignore
#
# Este workflow commitea backend/data/salidas/mapas/. Si esa ruta (o el
# patron *.json, que alcanzaba a indice.json) esta ignorada, `git add` no
# hace nada, el paso figura en verde y no se publica nada. Verificalo con:
#     git check-ignore -v backend/data/salidas/mapas/indice.json
# ============================================================

name: Mapas diarios

on:
  schedule:
    # 09:00 UTC = 04:00 en Peru. A esa hora OISST ya publico el dato del
    # dia anterior y el runner esta descongestionado.
    - cron: "0 9 * * *"
  # Permite lanzarlo a mano desde la pestaña Actions. Imprescindible el
  # dia antes de presentar: no quieres descubrir a las 8 de la mañana que
  # el cron llevaba una semana desactivado.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Se instala la lista minima que necesita construir_mapas.py, no
      # backend/requirements.txt entero: el runner no monta la API ni
      # ejecuta los analisis, y arrastrar matplotlib/fastapi aqui solo
      # alarga la corrida.
      #
      # CONTRAPARTIDA: son dos declaraciones de dependencias que pueden
      # divergir. Si construir_mapas.py o core_series.py empiezan a
      # importar algo nuevo, hay que añadirlo TAMBIEN aqui, o el workflow
      # fallara con un ModuleNotFoundError que no se reproduce en local.
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api

      - name: Regenerar los mapas
        env:
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
        # working-directory importa: el script inserta su propia raiz en
        # sys.path, pero mantenemos backend/ como cwd para que cualquier
        # ruta relativa que quede en el core apunte donde debe.
        working-directory: backend
        run: python scripts/construir_mapas.py

      - name: Verificar que la corrida produjo mapas
        working-directory: backend
        run: |
          python - <<'PY'
          import json, sys
          with open('data/salidas/mapas/indice.json', encoding='utf-8') as f:
              d = json.load(f)
          # 'disponible' NO es 'regenerado'. El script conserva el mapa
          # del dia anterior cuando GEE falla, asi que el indice puede
          # estar completo sin que la corrida haya generado nada. Contar
          # disponibles dejaria el workflow en verde mientras los mapas
          # envejecen sin que nadie se entere.
          frescos = [k for k, v in d.items()
                     if v.get('archivo') and 'error_ultimo_intento' not in v]
          viejos  = [k for k, v in d.items() if 'error_ultimo_intento' in v]
          rotos   = [k for k, v in d.items() if not v.get('archivo')]
          print(f'{len(frescos)} regenerados, {len(viejos)} conservados, '
                f'{len(rotos)} sin mapa')
          for k in viejos:
              print(f'  CONSERVADO: {k} -> {d[k]["error_ultimo_intento"][:120]}')
          for k in rotos:
              print(f'  SIN MAPA: {k} -> {d[k].get("error")}')
          if not frescos:
              sys.exit('Ningun mapa se regenero hoy. La app sigue servible '
                       'con los anteriores, pero esto requiere atencion.')
          PY

      - name: Commitear si algo cambio
        run: |
          git config user.name  'pulso-bot'
          git config user.email 'actions@github.com'
          git add backend/data/salidas/mapas
          # --quiet devuelve 1 cuando NO hay cambios. Sin este guardia, el
          # workflow figuraria en rojo cada dia que el mar no se movio, y
          # un panel siempre en rojo deja de avisar de nada.
          if git diff --staged --quiet; then
            echo 'Sin cambios: no se commitea.'
          else
            git commit -m "Actualiza indice y mapas $(date -u +%Y-%m-%d)"
            git push
          fi
