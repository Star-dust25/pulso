# .github/workflows/mapas-diarios.yml
# ============================================================
# PULSO — regeneracion diaria de los mapas
#
# Corre solo, todos los dias, y commitea los PNG actualizados.
#
# ------------------------------------------------------------
# POR QUE UN CRON EXTERNO Y NO LA PROPIA API
#
# (El argumento antiguo era que Streamlit Cloud dormia la app a las 12 h
# sin trafico. Ya no aplica: no hay Streamlit. El motivo real es otro y
# es mas fuerte.)
#
# Componer una imagen en Earth Engine tarda entre diez y cuarenta
# segundos: es computo real, tesela por tesela, no latencia de red. Eso
# no puede vivir dentro de una peticion HTTP — el usuario se queda
# mirando una pantalla en blanco y el worker de FastAPI queda bloqueado.
#
# Ademas, el motor de vigilancia debe correr aunque nadie mire. Si los
# mapas se generaran al abrir la pestaña, estarian frescos justo cuando
# no importa y viejos de madrugada, que es cuando importa.
#
# ------------------------------------------------------------
# LO QUE HAY QUE CONFIGURAR ANTES (una vez)
#
# 1. Google Cloud: crear una cuenta de servicio y registrarla en Earth
#    Engine (https://signup.earthengine.google.com/#!/service_accounts).
#
# 2. GitHub: Settings > Secrets and variables > Actions > New secret
#       Nombre : GEE_SERVICE_ACCOUNT
#       Valor  : el JSON de la cuenta, COMPLETO y en una sola linea.
#
# El JSON NUNCA va al repositorio. Si alguna vez se sube por error, hay
# que revocar la clave en Google Cloud: borrarla del historico de git no
# la invalida.
#
# ------------------------------------------------------------
# OJO CON .gitignore
#
# Este workflow commitea backend/data/salidas/mapas/. Si esa ruta (o el
# patron *.json, que alcanzaba a indice.json) esta ignorada, `git add` no
# hace nada, el paso figura en verde y no se publica nada. Verificalo con:
#     git check-ignore -v backend/data/salidas/mapas/indice.json
# ============================================================

name: Mapas diarios

on:
  schedule:
    # 09:00 UTC = 04:00 en Peru. A esa hora OISST ya publico el dato del
    # dia anterior y el runner esta descongestionado.
    - cron: "0 9 * * *"
  # Permite lanzarlo a mano desde la pestaña Actions. Imprescindible el
  # dia antes de presentar: no quieres descubrir a las 8 de la mañana que
  # el cron llevaba una semana fallando.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api pandas numpy

      - name: Regenerar los mapas
        env:
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
        # working-directory importa: el script inserta su propia raiz en
        # sys.path, pero mantenemos backend/ como cwd para que cualquier
        # ruta relativa que quede en el core apunte donde debe.
        working-directory: backend
        run: python scripts/construir_mapas.py

      - name: Verificar que el indice quedo utilizable
        # Si TODOS los mapas fallan, el paso anterior termina en verde
        # (el script captura las excepciones a proposito). Sin este
        # guardia, el workflow celebraria una corrida que no produjo nada.
        working-directory: backend
        run: |
          python - <<'PY'
          import json, sys
          with open('data/salidas/mapas/indice.json', encoding='utf-8') as f:
              d = json.load(f)
          ok = [k for k, v in d.items() if v.get('archivo')]
          print(f'{len(ok)}/{len(d)} mapas disponibles')
          for k, v in d.items():
              if not v.get('archivo'):
                  print(f'  SIN MAPA: {k} -> {v.get("error")}')
          if not ok:
              sys.exit('Ningun mapa disponible: no se commitea nada.')
          PY

      - name: Commitear si algo cambio
        run: |
          git config user.name  'pulso-bot'
          git config user.email 'actions@github.com'
          git add backend/data/salidas/mapas
          # --quiet devuelve 1 cuando NO hay cambios. Sin este guardia, el
          # workflow figuraria en rojo cada dia que el mar no se movio, y
          # un panel siempre en rojo deja de avisar de nada.
          if git diff --staged --quiet; then
            echo 'Sin cambios: no se commitea.'
          else
            git commit -m "Mapas actualizados $(date -u +%Y-%m-%d)"
            git push
          fi
